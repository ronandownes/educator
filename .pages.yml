media:
  input: assets/uploads
  output: /assets/uploads

# Shared field definitions live here so sidebar items below can be moved freely.
components:
  home_fields:
    type: object
    label: Home fields
    fields: &homefields
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, label: Title }
      - { name: eyebrow, type: string, label: Eyebrow }
      - { name: intro, type: text, label: Introduction }
      - { name: body, type: rich-text, label: Page content }

  document_fields:
    type: object
    label: Document fields
    fields: &docfields
      - { name: layout, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }
      - { name: cms_key, type: string, hidden: true }
      - { name: title, type: string, label: Title }
      - { name: eyebrow, type: string, label: Eyebrow }
      - { name: intro, type: text, label: Introduction }
      - { name: body, type: rich-text, label: Answers }

# ==============================================================
# SIDEBAR ORDER
# Move a WHOLE line up or down to rearrange the Pages CMS sidebar.
# The shared field definitions above do not need to move.
# ==============================================================
content:
  - { name: home, label: "Home", type: file, path: index.md, format: yaml-frontmatter, fields: *homefields }
